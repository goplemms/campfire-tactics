name: CI

# Quality gate: type-check + unit suite + the run-sim on every PR (and main pushes),
# plus the headless real-browser E2Es — the deploy→battle click-through, the #scene
# harness, AND the overworld authored-event screens. The scene E2Es are load-bearing:
# vitest/sim never render a Phaser scene, so a render-only freeze passes them.
on:
  pull_request:
  push:
    branches: [main]

# One run per ref; cancel a superseded run when new commits land.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # tsc --noEmit && vite build
      - run: npm test # vitest run — the fast core suite
      - run: npm run sim # the run-simulator digest (routing/reward regressions)
      # The E2Es drive the real Phaser scenes in headless Chrome. The GitHub
      # ubuntu image ships Google Chrome with its libs; point the harness at it
      # (CHROME_BIN) instead of downloading chrome-for-testing.
      - name: Locate Chrome
        id: chrome
        run: echo "path=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser)" >> "$GITHUB_OUTPUT"
      - name: E2E (deploy → battle click-through)
        run: npm run test:e2e
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
      - name: E2E (#scene isolated-encounter harness)
        run: npm run test:e2e:scenario
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
      - name: E2E (guard-doctrine harness — door-drive render surface)
        run: npm run test:e2e:doctrine
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
      - name: E2E (visual level editor — paint + export + import round-trip)
        run: npm run test:e2e:editor
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
      - name: E2E (editor soft-play — playtest a draft in-scene and return)
        run: npm run test:e2e:editor:playtest
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
      - name: E2E (editor local persistence — autosave + named library across a reload)
        run: npm run test:e2e:editor:persist
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
      - name: E2E (JSON level pipeline — #level boot + play)
        run: npm run test:e2e:level
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
      - name: E2E (overworld authored-event screens)
        run: npm run test:e2e:arc
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
      - name: E2E (The Rescue — injected-finale expedition)
        run: npm run test:e2e:rescue
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
      - name: E2E (repro-dump capture + restore)
        run: npm run test:e2e:repro
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
      - name: E2E (second battle — stale-cached-object re-entry freeze)
        run: npm run test:e2e:second-battle
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
      - name: E2E (micro-interaction harness — per-mechanic render guards)
        run: npm run test:e2e:micro
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
      - name: E2E (guild hall — caravan-return banner modal + backdrop)
        run: npm run test:e2e:guild-banner
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
      # Visual audit: walk the 14 player-facing surfaces, capture each, and run the
      # in-page geometric linter (text overlap / off-canvas / invisible / dead control)
      # + the per-surface coverage gate. Fails on any error-severity finding — the class
      # of visual bug (overlapping text, cramped margins, wrong screen) that renders fine
      # yet passes vitest/sim. Slower than the click-throughs (several surfaces re-boot).
      - name: Visual audit (14-surface geometric + coverage sweep)
        run: npm run audit:visual
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
      # Guard the guards: prove every text-based coverage gate is SPECIFIC (true only on
      # its own screen), so a loose phrase can't let a wrong-screen capture read as clean.
      - name: Visual-audit coverage-gate specificity
        run: npm run audit:challenge
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
      # On a red E2E / audit, keep the stage + failure + audit screenshots so the break
      # is diagnosable from the run page without reproducing locally.
      - name: Upload E2E screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: screenshots/
          if-no-files-found: ignore
